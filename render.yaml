services:
  - type: web
    name: sqli-detector-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: false
